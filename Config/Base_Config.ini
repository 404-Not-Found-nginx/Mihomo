# ========================================================
# Mihomo / OpenClash 基础控制底座
# 由北美豆包整合，人工筛选，基于ACL4SSR和本仓库旧版改造
# 非最终版，随用随测随改
# ========================================================

# > 基础入站与运行模式
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false

# > 内存与核心并发调优 (Mihomo 专有特性)
unified-delay: true
tcp-concurrent: true
find-process-mode: off

# > 外部控制端 (保持高位安全端口，Secret 留空交由插件管理)
external-controller: 0.0.0.0:9090
secret: ""

# > 流量域名嗅探器 (强制纠偏 HTTP-DNS 与纯 IP 连接)
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    QUIC:
      ports: [443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.apple.com"
    - "+.push.apple.com"

# > 核心 DNS 控制拓扑 (单轨高纯度架构)
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  use-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # Fake-IP 过滤白名单 (仅保留网络心跳与局域网基础设施)
  fake-ip-filter:
    # 局域网与内部主机
    - "*.lan"
    - "*.local"
    - "*.internal"
    - "*.home.arpa"
    # 系统级网络连通性检测 (NCSI / Captive Portal)
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.msftncsi.com.cn"
    - "captive.apple.com"
    - "connectivitycheck.gstatic.com"
    - "detectportal.firefox.com"
    # NTP 网络对时服务
    - "+.pool.ntp.org"
    - "+.time.edu.cn"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    # 联机与 STUN 穿透服务
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"

  # 1. 基础引导层：仅使用纯 IP 解析节点域名与 DoH 域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 2. 本地直连解析主通道：国内安全 DoH (仅负责命中 DIRECT 的流量)
  nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
